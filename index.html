<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jugadas Rugby 15</title>
  <style>
    :root {
      --bg: #101412;
      --side: #efe6d5;
      --surface: #fff9ee;
      --ink: #111815;
      --muted: #68726d;
      --field: #2d7c4a;
      --field-dark: #24663c;
      --line: rgba(255,255,255,.82);
      --forwards: #ffd891;
      --backs: #9ed3ff;
      --enemy: #111;
      --route: #202824;
      --route-soft: rgba(32,40,36,.22);
      --trail: #f1c15b;
      --ball: #c46432;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }

    aside {
      background: var(--side);
      color: var(--ink);
      padding: 18px;
      display: grid;
      grid-template-rows: auto auto auto auto 1fr;
      gap: 16px;
      border-right: 1px solid rgba(0,0,0,.16);
    }

    h1, h2, p { margin: 0; }
    h1 { font-size: 24px; line-height: 1; }
    h2 { font-size: 34px; line-height: 1; }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      margin-top: 6px;
    }

    .stack { display: grid; gap: 9px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

    button {
      min-height: 42px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #c9bca6;
      background: var(--surface);
      color: var(--ink);
      font-weight: 900;
      cursor: pointer;
    }

    .play-btn { text-align: left; font-size: 16px; }
    button.active, button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--surface);
      border-color: var(--ink);
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #d99a36;
    }

    .node-readout {
      min-height: 34px;
      display: grid;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,.42);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .legend {
      display: grid;
      gap: 10px;
      align-content: start;
      color: var(--muted);
      font-size: 13px;
    }

    .key {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px;
      align-items: center;
    }

    .mark {
      justify-self: center;
      display: block;
    }

    .dot {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 2px solid #111;
      background: var(--backs);
    }
    .dot.forward { background: var(--forwards); }
    .dot.enemy { width: 15px; height: 15px; border: 0; background: #111; }
    .ball-mark {
      width: 24px;
      height: 14px;
      border-radius: 50%;
      background: var(--ball);
      border: 2px solid #ffe8c2;
      transform: rotate(-20deg);
    }
    .line-mark {
      width: 26px;
      height: 4px;
      border-radius: 99px;
      background: var(--route);
    }

    main {
      min-width: 0;
      padding: 18px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 14px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
    }

    .state {
      color: #e9f2ee;
      font-weight: 900;
      text-align: right;
    }

    .board-wrap {
      min-height: 0;
      display: grid;
      place-items: center;
    }

    .board-shell {
      width: 100%;
      max-height: 100%;
      aspect-ratio: 1000 / 620;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 12px;
      overflow: hidden;
      background: #1d2824;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      background: var(--field);
      user-select: none;
    }

    .bottom {
      display: grid;
      grid-template-columns: 90px 100px minmax(180px, 1fr) 170px 74px;
      gap: 10px;
      align-items: center;
    }

    .time {
      color: #e9f2ee;
      font-weight: 900;
      text-align: right;
    }

    .paper { fill: #f6f0e3; }
    .paper-line { fill: none; stroke: rgba(0,0,0,.12); stroke-width: 2; }
    .field-bg { fill: var(--field); }
    .stripe { fill: var(--field-dark); opacity: .22; }
    .field-line { fill: none; stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
    .dash { stroke-dasharray: 13 13; }
    .route { fill: none; stroke: var(--route); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .62; }
    .route-muted { fill: none; stroke: var(--route); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 10; opacity: .32; }
    .trail { fill: none; stroke: var(--trail); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: .95; }
    .arrow { fill: var(--route); opacity: .55; }
    .node { fill: #fff8e8; stroke: #1b211e; stroke-width: 2; cursor: grab; }
    .node.selected { fill: var(--trail); stroke-width: 3; }
    .player circle { stroke: #111; stroke-width: 2.3; }
    .player text { fill: #111; font-size: 14px; font-weight: 900; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .forward circle { fill: var(--forwards); }
    .back circle { fill: var(--backs); }
    .active-ring { fill: none; stroke: var(--trail); stroke-width: 4; opacity: .95; }
    .enemy { fill: #111; }
    .ball { fill: var(--ball); stroke: #ffe8c2; stroke-width: 3; }
    .ruck { fill: rgba(255,255,255,.12); stroke: rgba(255,255,255,.85); stroke-width: 3; }
    .ruck.preview { fill: rgba(0,0,0,.03); stroke: rgba(0,0,0,.18); }
    .label { fill: rgba(0,0,0,.58); font-size: 16px; font-weight: 900; }
    .field-label { fill: rgba(255,255,255,.48); font-size: 20px; font-weight: 900; }

    @media (max-width: 720px) {
      .app { grid-template-columns: 1fr; }
      aside { grid-template-rows: auto; }
      main { padding: 12px; min-height: 70vh; }
      .bottom { grid-template-columns: 1fr 1fr; }
      .bottom input, .bottom label, .time { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div>
        <h1>Jugadas Rugby 15</h1>
        <p class="muted">Simulador táctico. Jugadores estables. Pelota por ruta editable.</p>
      </div>

      <div class="stack" id="playList"></div>

      <div class="row">
        <button id="previewBtn" type="button" aria-pressed="true">Preview</button>
        <button id="simBtn" type="button" aria-pressed="false">Simulación</button>
      </div>

      <div class="stack">
        <button id="editBtn" type="button" aria-pressed="false">Editar ruta pelota</button>
        <div class="node-readout" id="nodeReadout">Nodo pelota: 1</div>
        <label>X nodo <input id="nodeX" type="range" min="60" max="940" value="850"></label>
        <label>Y nodo <input id="nodeY" type="range" min="70" max="550" value="160"></label>
        <button id="resetBtn" type="button">Reset ruta</button>
      </div>

      <div class="legend">
        <div class="key"><span class="mark dot forward"></span><span>Forward</span></div>
        <div class="key"><span class="mark dot"></span><span>Back</span></div>
        <div class="key"><span class="mark dot enemy"></span><span>Defensa</span></div>
        <div class="key"><span class="mark ball-mark"></span><span>Pelota</span></div>
        <div class="key"><span class="mark line-mark"></span><span>Ruta editable</span></div>
      </div>
    </aside>

    <main>
      <section class="top">
        <div>
          <h2 id="title"></h2>
          <p class="muted" id="desc"></p>
        </div>
        <div class="state" id="state">Preview</div>
      </section>

      <section class="board-wrap">
        <div class="board-shell">
          <svg id="board" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </section>

      <section class="bottom">
        <button id="playBtn" type="button">Play</button>
        <button id="restartBtn" type="button">Reiniciar</button>
        <input id="scrub" type="range" min="0" max="1000" value="0">
        <label>Velocidad <input id="speed" type="range" min="0.6" max="1.6" step="0.1" value="1"></label>
        <span class="time" id="clock">0.0s</span>
      </section>
    </main>
  </div>

  <script>
    const basePlays = {
      casita: {
        name: 'Casita',
        desc: 'Line derecha. Contacto corto. Vuelta izquierda. Cierre al 14.',
        duration: 15,
        players: {
          1:[800,168], 2:[850,160], 3:[820,210], 4:[760,218], 6:[720,252],
          7:[610,275], 8:[555,300], 9:[675,340], 10:[610,333],
          11:[320,425], 12:[392,388], 13:[235,405], 14:[865,382], 15:[305,378]
        },
        enemies: [[535,250],[455,292],[360,335],[275,386],[635,354],[735,365],[830,388]],
        rucks: [[520,300],[190,415],[405,462]],
        route: [[850,160],[800,250],[675,340],[610,333],[555,300],[520,300],[470,345],[610,333],[305,378],[392,388],[235,405],[190,415],[250,458],[405,462],[520,442],[610,420],[700,405],[790,392],[865,382],[930,370]],
        fake: []
      },
      j25: {
        name: 'Jugada 25',
        desc: 'Scrum. 12 al contacto. 15 entra. Escalera final al 11.',
        duration: 14,
        players: {
          1:[305,462], 2:[400,477], 3:[492,482], 4:[565,420], 5:[205,438],
          7:[292,300], 8:[555,330], 9:[505,350], 10:[585,470],
          11:[100,415], 12:[325,340], 13:[548,300], 14:[750,352], 15:[642,330]
        },
        enemies: [[300,292],[245,340],[330,390],[470,270],[560,292],[660,325],[750,382],[390,430],[185,410]],
        rucks: [[275,340],[745,350],[680,448]],
        route: [[555,330],[505,350],[325,340],[275,340],[330,372],[505,350],[585,470],[548,300],[642,330],[750,352],[745,350],[680,448],[505,350],[492,482],[400,477],[305,462],[205,438],[100,415],[60,410]],
        fake: []
      },
      j27: {
        name: 'Jugada 27',
        desc: 'Scrum a izquierda. Finta. Cambio al lado de entrada. 11 final.',
        duration: 13,
        players: {
          1:[430,458], 2:[525,458], 3:[805,426], 4:[620,450], 5:[715,438],
          7:[215,292], 8:[335,370], 9:[505,350], 10:[425,345],
          11:[890,405], 12:[315,320], 13:[250,330], 14:[190,372], 15:[270,455]
        },
        enemies: [[300,270],[260,320],[225,365],[460,315],[555,335],[650,355],[750,385],[850,410],[930,425]],
        rucks: [[275,320],[805,426]],
        route: [[550,335],[505,350],[315,320],[275,320],[505,350],[430,458],[525,458],[620,450],[715,438],[805,426],[805,426],[505,350],[890,405],[950,392]],
        fake: [[505,350],[250,330],[215,292]]
      }
    };

    const forwards = new Set(['1','2','3','4','5','6','7','8']);
    const plays = structuredClone(basePlays);
    const board = document.getElementById('board');
    const playList = document.getElementById('playList');
    const title = document.getElementById('title');
    const desc = document.getElementById('desc');
    const state = document.getElementById('state');
    const previewBtn = document.getElementById('previewBtn');
    const simBtn = document.getElementById('simBtn');
    const editBtn = document.getElementById('editBtn');
    const nodeReadout = document.getElementById('nodeReadout');
    const nodeX = document.getElementById('nodeX');
    const nodeY = document.getElementById('nodeY');
    const resetBtn = document.getElementById('resetBtn');
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const scrub = document.getElementById('scrub');
    const speed = document.getElementById('speed');
    const clock = document.getElementById('clock');

    let current = 'casita';
    let mode = 'preview';
    let editing = false;
    let playing = false;
    let time = 0;
    let selectedNode = 0;
    let draggingNode = null;
    let previousFrame = 0;

    Object.entries(plays).forEach(([id, play]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'play-btn';
      button.textContent = play.name;
      button.addEventListener('click', () => {
        current = id;
        time = 0;
        selectedNode = 0;
        editing = false;
        playing = false;
        render();
      });
      playList.appendChild(button);
    });

    function play() { return plays[current]; }
    function basePlay() { return basePlays[current]; }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }
    function lerp(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }
    function ease(k) { return k * k * (3 - 2 * k); }

    function pathLength(points) {
      let total = 0;
      for (let i = 1; i < points.length; i++) total += dist(points[i - 1], points[i]);
      return total;
    }

    function pointAtDistance(points, distance) {
      let walked = 0;
      for (let i = 1; i < points.length; i++) {
        const segment = dist(points[i - 1], points[i]);
        if (walked + segment >= distance) {
          return lerp(points[i - 1], points[i], (distance - walked) / Math.max(1, segment));
        }
        walked += segment;
      }
      return points[points.length - 1];
    }

    function progressPoint(points, progress) {
      return pointAtDistance(points, pathLength(points) * clamp(progress, 0, 1));
    }

    function nearestNodeIndex(points, progress) {
      const target = pathLength(points) * clamp(progress, 0, 1);
      let walked = 0;
      let best = 0;
      let bestDelta = Infinity;
      points.forEach((point, index) => {
        if (index > 0) walked += dist(points[index - 1], point);
        const delta = Math.abs(target - walked);
        if (delta < bestDelta) {
          bestDelta = delta;
          best = index;
        }
      });
      return best;
    }

    function d(points) {
      if (points.length < 2) return '';
      return `M ${points.map(point => `${point[0]} ${point[1]}`).join(' L ')}`;
    }

    function arrow(a, b) {
      const angle = Math.atan2(b[1] - a[1], b[0] - a[0]);
      const size = 12;
      const p1 = [b[0] - size * Math.cos(angle - .45), b[1] - size * Math.sin(angle - .45)];
      const p2 = [b[0] - size * Math.cos(angle + .45), b[1] - size * Math.sin(angle + .45)];
      return `${b[0]},${b[1]} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}`;
    }

    function field(preview) {
      if (preview) {
        return `<rect class="paper" width="1000" height="620"></rect>
          <rect class="paper-line" x="40" y="40" width="920" height="540"></rect>
          <text class="label" x="62" y="72">Preview tactico</text>`;
      }
      return `<rect class="field-bg" width="1000" height="620"></rect>
        <rect class="stripe" x="105" y="35" width="145" height="550"></rect>
        <rect class="stripe" x="500" y="35" width="250" height="550"></rect>
        <g class="field-line">
          <rect x="35" y="35" width="930" height="550"></rect>
          <line x1="105" y1="35" x2="105" y2="585"></line>
          <line x1="895" y1="35" x2="895" y2="585"></line>
          <line x1="500" y1="35" x2="500" y2="585"></line>
          <line class="dash" x1="250" y1="35" x2="250" y2="585"></line>
          <line class="dash" x1="750" y1="35" x2="750" y2="585"></line>
        </g>
        <text class="field-label" x="72" y="315">TRY</text>
        <text class="field-label" x="905" y="315">TRY</text>`;
    }

    function player(number, point, active) {
      const role = forwards.has(number) ? 'forward' : 'back';
      return `<g class="player ${role}" transform="translate(${point[0]} ${point[1]})">
        ${active ? '<circle class="active-ring" r="24"></circle>' : ''}
        <circle r="18"></circle>
        <text>${number}</text>
      </g>`;
    }

    function ball(point) {
      return `<g transform="translate(${point[0]} ${point[1]}) rotate(-18)">
        <ellipse class="ball" rx="15" ry="9"></ellipse>
      </g>`;
    }

    function ruck(point, preview) {
      return `<path class="${preview ? 'ruck preview' : 'ruck'}" d="
        M ${point[0]-26} ${point[1]}
        L ${point[0]-13} ${point[1]-20}
        L ${point[0]+5} ${point[1]-24}
        L ${point[0]+24} ${point[1]-8}
        L ${point[0]+20} ${point[1]+14}
        L ${point[0]} ${point[1]+24}
        L ${point[0]-18} ${point[1]+15} Z"></path>`;
    }

    function routeSubset(points, progress) {
      const total = pathLength(points);
      const target = total * clamp(progress, 0, 1);
      const result = [points[0]];
      let walked = 0;
      for (let i = 1; i < points.length; i++) {
        const segment = dist(points[i - 1], points[i]);
        if (walked + segment < target) {
          result.push(points[i]);
        } else {
          result.push(lerp(points[i - 1], points[i], (target - walked) / Math.max(1, segment)));
          break;
        }
        walked += segment;
      }
      return result;
    }

    function closestPlayerToBall(ballPoint) {
      let best = null;
      let bestDistance = Infinity;
      Object.entries(play().players).forEach(([number, point]) => {
        const delta = dist(ballPoint, point);
        if (delta < bestDistance) {
          bestDistance = delta;
          best = number;
        }
      });
      return bestDistance < 58 ? best : null;
    }

    function syncInputs() {
      const point = play().route[selectedNode];
      nodeX.value = Math.round(point[0]);
      nodeY.value = Math.round(point[1]);
      nodeReadout.textContent = `Nodo pelota: ${selectedNode + 1} / ${play().route.length}`;
    }

    function render() {
      const item = play();
      const progress = clamp(time / item.duration, 0, 1);
      const preview = mode === 'preview';
      const ballPoint = progressPoint(item.route, ease(progress));
      if (!editing && !preview) selectedNode = nearestNodeIndex(item.route, progress);
      let html = field(preview);

      if (preview) {
        html += `<path class="route" d="${d(item.route)}"></path>`;
        for (let i = 2; i < item.route.length; i += 4) html += `<polygon class="arrow" points="${arrow(item.route[i - 1], item.route[i])}"></polygon>`;
        if (item.fake.length) html += `<path class="route-muted" d="${d(item.fake)}"></path>`;
        if (editing) {
          item.route.forEach((point, index) => {
            html += `<circle class="node ${index === selectedNode ? 'selected' : ''}" data-node="${index}" cx="${point[0]}" cy="${point[1]}" r="${index === selectedNode ? 7 : 5}"></circle>`;
          });
        }
      } else {
        const trail = routeSubset(item.route, ease(progress));
        if (trail.length > 1) html += `<path class="trail" d="${d(trail)}"></path>`;
      }

      item.enemies.forEach(point => html += `<circle class="enemy" cx="${point[0]}" cy="${point[1]}" r="10"></circle>`);
      item.rucks.forEach(point => {
        if (preview || dist(ballPoint, point) < 65) html += ruck(point, preview);
      });

      const active = closestPlayerToBall(ballPoint);
      Object.entries(item.players).forEach(([number, point]) => html += player(number, point, number === active));
      html += ball(preview ? item.route[editing ? selectedNode : 0] : ballPoint);

      board.innerHTML = html;
      title.textContent = item.name;
      desc.textContent = item.desc;
      state.textContent = preview ? 'Preview' : playing ? 'Simulando' : 'Simulacion pausada';
      previewBtn.setAttribute('aria-pressed', String(preview));
      simBtn.setAttribute('aria-pressed', String(!preview));
      editBtn.setAttribute('aria-pressed', String(editing));
      editBtn.textContent = editing ? 'Salir de edicion' : 'Editar ruta pelota';
      playBtn.textContent = playing ? 'Pausa' : 'Play';
      scrub.value = Math.round(progress * 1000);
      clock.textContent = `${time.toFixed(1)}s`;
      [...playList.children].forEach((button, index) => button.classList.toggle('active', Object.keys(plays)[index] === current));
      syncInputs();
    }

    function setMode(next) {
      mode = next;
      if (next === 'preview') playing = false;
      render();
    }

    function moveNode(index, point) {
      play().route[index] = [clamp(point[0], 60, 940), clamp(point[1], 70, 550)];
      selectedNode = index;
      render();
    }

    function svgPoint(event) {
      const point = board.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      const transformed = point.matrixTransform(board.getScreenCTM().inverse());
      return [transformed.x, transformed.y];
    }

    previewBtn.addEventListener('click', () => setMode('preview'));
    simBtn.addEventListener('click', () => setMode('sim'));
    editBtn.addEventListener('click', () => {
      editing = !editing;
      mode = 'preview';
      playing = false;
      render();
    });
    resetBtn.addEventListener('click', () => {
      plays[current].route = structuredClone(basePlay().route);
      selectedNode = 0;
      render();
    });
    playBtn.addEventListener('click', () => {
      mode = 'sim';
      editing = false;
      if (time >= play().duration) time = 0;
      playing = !playing;
      render();
    });
    restartBtn.addEventListener('click', () => {
      time = 0;
      playing = false;
      render();
    });
    scrub.addEventListener('input', () => {
      mode = 'sim';
      playing = false;
      time = Number(scrub.value) / 1000 * play().duration;
      render();
    });
    nodeX.addEventListener('input', () => moveNode(selectedNode, [Number(nodeX.value), Number(nodeY.value)]));
    nodeY.addEventListener('input', () => moveNode(selectedNode, [Number(nodeX.value), Number(nodeY.value)]));

    board.addEventListener('pointerdown', event => {
      if (!editing || mode !== 'preview') return;
      const node = event.target.closest('[data-node]');
      if (!node) return;
      draggingNode = Number(node.dataset.node);
      selectedNode = draggingNode;
      board.setPointerCapture(event.pointerId);
      render();
    });
    board.addEventListener('pointermove', event => {
      if (draggingNode === null) return;
      moveNode(draggingNode, svgPoint(event));
    });
    board.addEventListener('pointerup', event => {
      draggingNode = null;
      try { board.releasePointerCapture(event.pointerId); } catch (_) {}
    });

    function loop(now) {
      if (!previousFrame) previousFrame = now;
      const delta = (now - previousFrame) / 1000;
      previousFrame = now;
      if (playing && mode === 'sim') {
        time += delta * Number(speed.value);
        if (time >= play().duration) {
          time = play().duration;
          playing = false;
        }
        render();
      }
      requestAnimationFrame(loop);
    }

    render();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
