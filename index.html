<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jugadas Rugby 15</title>
  <style>
    :root {
      --bg: #101514;
      --panel: #f4efe3;
      --ink: #17201d;
      --muted: #64736e;
      --field: #2e7e49;
      --line: rgba(255,255,255,.78);
      --pass: #40a9ff;
      --run: #ffbd3d;
      --ruck: #e44f4b;
      --fake: #9b6df0;
      --attack: #fff1d0;
      --backs: #cfeaff;
      --def: #20312c;
      --ball: #b95b2e;
      --try: #fff2a8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--panel);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      background: var(--panel);
      color: var(--ink);
      padding: 16px;
      border-right: 1px solid rgba(0,0,0,.18);
    }

    h1, h2, p { margin: 0; }

    h1 {
      font-size: 22px;
      line-height: 1.05;
      margin-bottom: 14px;
    }

    .plays, .tools, .legend {
      display: grid;
      gap: 8px;
    }

    .plays { margin-bottom: 14px; }
    .tools { margin: 14px 0; }

    button {
      border: 1px solid #c8beaa;
      background: #fffaf0;
      color: var(--ink);
      font-weight: 800;
      border-radius: 8px;
      min-height: 40px;
      padding: 9px 11px;
      cursor: pointer;
    }

    .plays button { text-align: left; }
    button.active, button[aria-pressed="true"] {
      background: var(--ink);
      color: #fffaf0;
      border-color: var(--ink);
    }

    .tool-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    input[type="range"] { accent-color: var(--run); width: 100%; }

    .legend {
      color: var(--muted);
      font-size: 13px;
    }

    .key {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px;
      align-items: center;
    }

    .swatch {
      width: 22px;
      height: 4px;
      border-radius: 999px;
    }

    .pass-s { background: var(--pass); }
    .run-s { background: var(--run); }
    .ruck-s { background: var(--ruck); }
    .fake-s {
      border-top: 3px dashed var(--fake);
      height: 0;
    }

    main {
      display: grid;
      grid-template-rows: auto minmax(440px, 1fr) auto;
      gap: 12px;
      padding: 16px;
      min-width: 0;
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 420px);
      gap: 14px;
      align-items: stretch;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .summary {
      color: #c8d4ce;
      line-height: 1.35;
      max-width: 920px;
    }

    .stepbox {
      background: rgba(244,239,227,.08);
      border: 1px solid rgba(244,239,227,.18);
      border-radius: 8px;
      padding: 11px 12px;
    }

    .stepbox strong {
      display: block;
      margin-bottom: 5px;
      color: #fff4df;
    }

    .stepbox p {
      line-height: 1.35;
      color: #eadfca;
    }

    .field-wrap {
      border: 1px solid rgba(244,239,227,.22);
      border-radius: 8px;
      overflow: hidden;
      background: #203029;
      position: relative;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 540px;
      touch-action: none;
    }

    .bottom {
      display: grid;
      grid-template-columns: auto auto minmax(160px, 620px) auto auto;
      gap: 9px;
      align-items: center;
    }

    .bottom button { min-width: 94px; }
    .timeline { color: #dce3df; font-weight: 800; min-width: 62px; }

    .speed {
      display: grid;
      grid-template-columns: 58px minmax(90px, 150px);
      gap: 8px;
      align-items: center;
      color: #dce3df;
      font-size: 13px;
      font-weight: 800;
    }

    .field-line { stroke: var(--line); stroke-width: 3; fill: none; }
    .zone { fill: rgba(255,242,168,.18); stroke: rgba(255,242,168,.72); stroke-width: 2; }
    .zone-text { fill: rgba(255,255,255,.55); font-size: 18px; font-weight: 900; text-anchor: middle; }
    .side-text { fill: rgba(255,255,255,.8); font-size: 13px; font-weight: 900; }

    .path {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrow);
      opacity: .95;
    }

    .pass { stroke: var(--pass); }
    .run { stroke: var(--run); }
    .ruck-line { stroke: var(--ruck); }
    .fake { stroke: var(--fake); stroke-dasharray: 9 9; }

    .route-glow {
      fill: none;
      stroke: rgba(0,0,0,.22);
      stroke-width: 9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ruck-zone {
      fill: rgba(228,79,75,.23);
      stroke: var(--ruck);
      stroke-width: 2;
    }

    .player circle {
      stroke: #101514;
      stroke-width: 2;
    }

    .player text {
      fill: #101514;
      font-size: 13px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .forward circle { fill: var(--attack); }
    .back circle { fill: var(--backs); }
    .carrier circle { stroke: var(--ball); stroke-width: 5; }
    .rucker circle { stroke: var(--ruck); stroke-width: 4; }
    .support circle { stroke: var(--run); stroke-width: 4; }

    .defender circle {
      fill: var(--def);
      stroke: #d9efe5;
      stroke-width: 2;
    }

    .defender text {
      fill: #f2fff9;
      font-size: 11px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .def-line {
      stroke: rgba(255,255,255,.34);
      stroke-width: 3;
      stroke-dasharray: 10 8;
      fill: none;
    }

    .ball {
      fill: var(--ball);
      stroke: #fff3d0;
      stroke-width: 3;
      cursor: grab;
    }

    .ball.editing { stroke: #ffffff; stroke-width: 5; }
    .ball-label { fill: #fff8dd; font-size: 12px; font-weight: 900; text-anchor: middle; pointer-events: none; }
    .try-text { fill: var(--try); font-size: 30px; font-weight: 900; text-anchor: middle; }

    @media (max-width: 920px) {
      .app { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid rgba(0,0,0,.18); }
      .plays { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .plays button { text-align: center; }
      .top { grid-template-columns: 1fr; }
      main { grid-template-rows: auto minmax(380px, 1fr) auto; padding: 12px; }
      svg { min-height: 430px; }
      .bottom { grid-template-columns: 1fr 1fr; }
      .bottom input[type="range"], .timeline, .speed { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Jugadas Rugby 15</h1>
      <div class="plays" id="playButtons"></div>

      <div class="tools">
        <button id="simBtn" type="button" aria-pressed="false">Simulacion</button>
        <button id="editBallBtn" type="button" aria-pressed="false">Editar pelota</button>
        <div class="tool-row">
          <label>X pelota <input id="ballX" type="range" min="35" max="965" value="500"></label>
          <label>Y pelota <input id="ballY" type="range" min="35" max="585" value="310"></label>
        </div>
        <button id="resetBallBtn" type="button">Reset pelota</button>
      </div>

      <div class="legend">
        <div class="key"><span class="swatch pass-s"></span><span>Pase</span></div>
        <div class="key"><span class="swatch run-s"></span><span>Carrera</span></div>
        <div class="key"><span class="swatch ruck-s"></span><span>Contacto / ruck</span></div>
        <div class="key"><span class="swatch fake-s"></span><span>Finta</span></div>
        <div class="key"><span></span><span>Negros: defensa rival</span></div>
      </div>
    </aside>

    <main>
      <section class="top">
        <div>
          <h2 id="playTitle"></h2>
          <p class="summary" id="playSummary"></p>
        </div>
        <div class="stepbox">
          <strong id="stepTitle"></strong>
          <p id="stepText"></p>
        </div>
      </section>

      <section class="field-wrap">
        <svg id="field" viewBox="0 0 1000 620" role="img" aria-label="Campo con jugada de rugby"></svg>
      </section>

      <section class="bottom">
        <button id="prevBtn" type="button">Anterior</button>
        <button id="nextBtn" type="button">Siguiente</button>
        <input id="stepRange" type="range" min="0" max="0" value="0">
        <span class="timeline" id="timeline"></span>
        <label class="speed">Velocidad <input id="speedRange" type="range" min="400" max="1800" value="900"></label>
      </section>
    </main>
  </div>

            ball: [430,390],
            focus: [790,410],
            players: {9:[285,410],1:[430,390],2:[510,405],4:[590,395],5:[665,410],3:[745,405],11:[830,430]},

            rucks: [[790,410]]

            arrows: [[2,[790,390],'ruck-line'],[5,[790,430],'ruck-line'],[9,11,'pass'],[11,[955,430],'run']],

    const forwards = new Set([1,2,3,4,5,6,7,8]);
    const customBall = {};
    let currentPlay = 'casita';
    let currentStep = 0;
    let simMode = false;
    let editBall = false;
    let simTimer = null;
    let dragBall = false;

    const field = document.getElementById('field');
    const playButtons = document.getElementById('playButtons');
    const playTitle = document.getElementById('playTitle');
    const playSummary = document.getElementById('playSummary');
    const stepTitle = document.getElementById('stepTitle');
    const stepText = document.getElementById('stepText');
    const stepRange = document.getElementById('stepRange');
    const timeline = document.getElementById('timeline');
    const simBtn = document.getElementById('simBtn');
    const editBallBtn = document.getElementById('editBallBtn');
    const resetBallBtn = document.getElementById('resetBallBtn');
    const ballX = document.getElementById('ballX');
    const ballY = document.getElementById('ballY');
    const speedRange = document.getElementById('speedRange');

    function stepKey() {
      return `${currentPlay}:${currentStep}`;
    }

    function play() {
      return plays[currentPlay];
    }

    function step() {
      return play().steps[currentStep];
    }

    function pos(ref, players, base) {
      if (Array.isArray(ref)) return ref;
      return players[ref] || base[ref];
    }

    function ballPos() {
      return customBall[stepKey()] || step().ball || [500,310];
    }

    function setBall(point) {
      const x = Math.max(35, Math.min(965, Math.round(point[0])));
      const y = Math.max(35, Math.min(585, Math.round(point[1])));
      customBall[stepKey()] = [x, y];
      render();
    }

    function buttons() {
      Object.entries(plays).forEach(([id, item]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = item.name;
        btn.addEventListener('click', () => {
          stopSim();
          currentPlay = id;
          currentStep = 0;
          render();
        });
        playButtons.appendChild(btn);
      });
    }

    function drawField() {
      return `
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"></path>
          </marker>
        </defs>
        <rect x="0" y="0" width="1000" height="620" fill="var(--field)"></rect>
        <rect class="zone" x="35" y="35" width="70" height="550"></rect>
        <rect class="zone" x="895" y="35" width="70" height="550"></rect>
        <g class="field-line">
          <rect x="35" y="35" width="930" height="550"></rect>
          <line x1="500" y1="35" x2="500" y2="585"></line>
          <line x1="105" y1="35" x2="105" y2="585"></line>
          <line x1="895" y1="35" x2="895" y2="585"></line>
          <line x1="250" y1="35" x2="250" y2="585" stroke-dasharray="12 12"></line>
          <line x1="750" y1="35" x2="750" y2="585" stroke-dasharray="12 12"></line>
        </g>
        <text class="zone-text" x="70" y="315" transform="rotate(-90 70 315)">TRY</text>
        <text class="zone-text" x="930" y="315" transform="rotate(90 930 315)">TRY</text>
        <text class="side-text" x="45" y="26">Izquierda</text>
        <text class="side-text" x="870" y="26">Derecha</text>
      `;
    }

    function drawArrows() {
      const s = step();
      const p = play();
      return (s.arrows || []).map(a => {
        const from = pos(a[0], s.players || {}, p.base);
        const to = pos(a[1], s.players || {}, p.base);
        return `
          <path class="route-glow" d="M ${from[0]} ${from[1]} L ${to[0]} ${to[1]}"></path>
          <path class="path ${a[2]}" d="M ${from[0]} ${from[1]} L ${to[0]} ${to[1]}"></path>
        `;
      }).join('');
    }

    function drawRucks() {
      return (step().rucks || []).map(([x,y]) => `<ellipse class="ruck-zone" cx="${x}" cy="${y}" rx="36" ry="23"></ellipse>`).join('');
    }

    function drawDefenders() {
      const defs = step().defenders || [];
      const line = defs.length > 1 ? `<path class="def-line" d="M ${defs.map(p => `${p[0]} ${p[1]}`).join(' L ')}"></path>` : '';
      const dots = defs.map((p, i) => `
        <g class="defender" transform="translate(${p[0]} ${p[1]})">
          <circle r="16"></circle>
          <text>D${i + 1}</text>
        </g>
      `).join('');
      return line + dots;
    }

    function drawPlayers() {
      const p = play();
      const s = step();
      const players = {...s.players};
      return Object.entries(players).map(([num, xy]) => {
        const n = Number(num);
        const role = forwards.has(n) ? 'forward' : 'back';
        let state = '';
        for (const a of s.arrows || []) {
          if (a[0] === n && a[2] === 'run') state = 'support';
          if (a[0] === n && a[2] === 'ruck-line') state = 'rucker';
        }
        const carrier = near(xy, ballPos(), 22) ? 'carrier' : '';
        return `
          <g class="player ${role} ${state} ${carrier}" transform="translate(${xy[0]} ${xy[1]})">
            <circle r="18"></circle>
            <text>${num}</text>
          </g>
        `;
      }).join('');
    }

    function drawBall() {
      const b = ballPos();
      return `
        <g id="ballGroup" transform="translate(${b[0]} ${b[1]})">
          <ellipse id="ballShape" class="ball ${editBall ? 'editing' : ''}" cx="0" cy="0" rx="14" ry="9" transform="rotate(-25)"></ellipse>
          ${editBall ? '<text class="ball-label" y="-18">pelota</text>' : ''}
        </g>
      `;
    }

    function drawSimBall() {
      if (!simMode) return '';
      const path = simPath();
      if (path.length < 2) return '';
      const d = `M ${path.map(p => `${p[0]} ${p[1]}`).join(' L ')}`;
      return `
        <path id="simPath" d="${d}" fill="none" stroke="none"></path>
        <ellipse class="ball" rx="15" ry="9" transform="rotate(-25)">
          <animateMotion dur="${Number(speedRange.value) * 2.8}ms" repeatCount="indefinite" path="${d}"></animateMotion>
        </ellipse>
      `;
    }

    function drawTry() {
      return step().tryAt ? `<text class="try-text" x="${step().tryAt[0]}" y="${step().tryAt[1] - 30}">TRY</text>` : '';
    }

    function simPath() {
      const s = step();
      const p = play();
      const points = [ballPos()];
      for (const a of s.arrows || []) {
        if (a[2] === 'pass' || a[2] === 'run') points.push(pos(a[1], s.players || {}, p.base));
      }
      return points;
    }

    function near(a, b, dist) {
      return Math.hypot(a[0] - b[0], a[1] - b[1]) <= dist;
    }

    function render() {
      const p = play();
      const s = step();
      playTitle.textContent = p.name;
      playSummary.textContent = p.summary;
      stepTitle.textContent = s.title;
      stepText.textContent = s.text;
      stepRange.max = p.steps.length - 1;
      stepRange.value = currentStep;
      timeline.textContent = `${currentStep + 1} / ${p.steps.length}`;
      simBtn.setAttribute('aria-pressed', String(simMode));
      editBallBtn.setAttribute('aria-pressed', String(editBall));
      [...playButtons.children].forEach((btn, i) => btn.classList.toggle('active', Object.keys(plays)[i] === currentPlay));
      const b = ballPos();
      ballX.value = b[0];
      ballY.value = b[1];
      field.innerHTML = drawField() + drawRucks() + drawDefenders() + drawArrows() + drawTry() + drawPlayers() + (simMode ? drawSimBall() : drawBall());
    }

    function nextStep() {
      currentStep = (currentStep + 1) % play().steps.length;
      render();
    }

    function prevStep() {
      currentStep = (currentStep - 1 + play().steps.length) % play().steps.length;
      render();
    }

    function startSim() {
      simMode = true;
      simBtn.setAttribute('aria-pressed', 'true');
      clearInterval(simTimer);
      simTimer = setInterval(nextStep, Number(speedRange.value));
      render();
    }

    function stopSim() {
      simMode = false;
      clearInterval(simTimer);
      simTimer = null;
      render();
    }

    function svgPoint(event) {
      const pt = field.createSVGPoint();
      pt.x = event.clientX;
      pt.y = event.clientY;
      const out = pt.matrixTransform(field.getScreenCTM().inverse());
      return [out.x, out.y];
    }

    field.addEventListener('pointerdown', event => {
      if (!editBall || simMode) return;
      const target = event.target;
      if (target.id !== 'ballShape' && target.id !== 'ballGroup') return;
      dragBall = true;
      field.setPointerCapture(event.pointerId);
    });

    field.addEventListener('pointermove', event => {
      if (!dragBall) return;
      setBall(svgPoint(event));
    });

    field.addEventListener('pointerup', event => {
      dragBall = false;
      try { field.releasePointerCapture(event.pointerId); } catch (_) {}
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      stopSim();
      prevStep();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      stopSim();
      nextStep();
    });

    stepRange.addEventListener('input', event => {
      stopSim();
      currentStep = Number(event.target.value);
      render();
    });

    simBtn.addEventListener('click', () => simMode ? stopSim() : startSim());

    editBallBtn.addEventListener('click', () => {
      editBall = !editBall;
      if (editBall) stopSim();
      render();
    });

    resetBallBtn.addEventListener('click', () => {
      delete customBall[stepKey()];
      render();
    });

    ballX.addEventListener('input', () => setBall([Number(ballX.value), Number(ballY.value)]));
    ballY.addEventListener('input', () => setBall([Number(ballX.value), Number(ballY.value)]));
    speedRange.addEventListener('input', () => { if (simMode) startSim(); });

    buttons();
    render();
  </script>
</body>
</html>
