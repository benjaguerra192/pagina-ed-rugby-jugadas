<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jugadas Rugby 15</title>
  <style>
    :root {
      --bg: #0f1412;
      --side: #efe7d8;
      --card: #fffaf0;
      --ink: #121817;
      --muted: #64706b;
      --field: #2f824d;
      --field2: #287444;
      --line: rgba(255,255,255,.82);
      --forward: #ffd68f;
      --back: #a7d7ff;
      --route: #303a36;
      --route2: #66706b;
      --ball: #c26332;
      --accent: #d99a36;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: #f8f1e6;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }

    aside {
      background: var(--side);
      color: var(--ink);
      padding: 18px;
      border-right: 1px solid rgba(0,0,0,.18);
      display: grid;
      grid-template-rows: auto auto auto auto 1fr;
      gap: 16px;
    }

    h1, h2, p { margin: 0; }

    h1 {
      font-size: 24px;
      line-height: 1.05;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      margin-top: 6px;
    }

    .stack {
      display: grid;
      gap: 9px;
    }

    button {
      min-height: 42px;
      border: 1px solid #c9bda9;
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      font-weight: 900;
      cursor: pointer;
      padding: 10px 12px;
    }

    button.active,
    button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--card);
      border-color: var(--ink);
    }

    .play-btn {
      text-align: left;
      font-size: 16px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .legend {
      display: grid;
      gap: 10px;
      align-content: start;
      color: var(--muted);
      font-size: 13px;
    }

    .key {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px;
      align-items: center;
    }

    .dot, .ball-icon, .line-icon {
      display: block;
      justify-self: center;
    }

    .dot {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 2px solid #111;
      background: var(--back);
    }

    .dot.forward { background: var(--forward); }
    .dot.enemy { background: #111; width: 16px; height: 16px; border: 0; }

    .ball-icon {
      width: 24px;
      height: 14px;
      border-radius: 50%;
      background: var(--ball);
      border: 2px solid #f8e9c8;
      transform: rotate(-20deg);
    }

    .line-icon {
      width: 26px;
      height: 4px;
      border-radius: 999px;
      background: var(--route);
    }

    main {
      min-width: 0;
      padding: 18px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 14px;
    }

    .top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    h2 {
      font-size: 34px;
      line-height: 1;
    }

    .state {
      font-weight: 900;
      color: #e9f2ee;
    }

    .board-wrap {
      min-height: 0;
      display: grid;
      place-items: center;
    }

    .board-shell {
      width: 100%;
      max-height: 100%;
      aspect-ratio: 1000 / 620;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
      background: #1f2b27;
      box-shadow: 0 16px 44px rgba(0,0,0,.32);
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      background: var(--field);
    }

    .bottom {
      display: grid;
      grid-template-columns: 90px 100px minmax(160px, 1fr) 170px 72px;
      gap: 10px;
      align-items: center;
    }

    .time {
      font-weight: 900;
      color: #e9f2ee;
      text-align: right;
    }

    .paper-bg { fill: #f7f2e6; }
    .field-bg { fill: var(--field); }
    .stripe { fill: var(--field2); opacity: .32; }
    .field-line { fill: none; stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
    .dash { stroke-dasharray: 12 14; }
    .route { fill: none; stroke: var(--route); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .48; }
    .route.secondary { stroke: var(--route2); stroke-dasharray: 10 10; opacity: .42; }
    .arrow { fill: var(--route); opacity: .5; }
    .player circle { stroke: #111; stroke-width: 2.4; }
    .player text { fill: #111; font-size: 14px; font-weight: 900; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .forward circle { fill: var(--forward); }
    .back circle { fill: var(--back); }
    .enemy { fill: #111; }
    .ball { fill: var(--ball); stroke: #ffe7bd; stroke-width: 3; }
    .ruck { fill: rgba(255,255,255,.1); stroke: rgba(255,255,255,.85); stroke-width: 3; }
    .ruck.preview { fill: rgba(0,0,0,.04); stroke: rgba(0,0,0,.24); }
    .small-label { fill: rgba(0,0,0,.58); font-size: 16px; font-weight: 900; }
    .field-label { fill: rgba(255,255,255,.45); font-size: 20px; font-weight: 900; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      aside { grid-template-rows: auto; }
      main { padding: 12px; }
      .bottom { grid-template-columns: 1fr 1fr; }
      .bottom input, .bottom label, .time { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div>
        <h1>Jugadas Rugby 15</h1>
        <p class="hint">Vista limpia. Sin pasos. Sin flechas en animacion.</p>
      </div>

      <div class="stack" id="plays"></div>

      <div class="row">
        <button id="preview" type="button" aria-pressed="true">Preview</button>
        <button id="animation" type="button" aria-pressed="false">Animacion</button>
      </div>

      <div class="stack">
        <button id="editBall" type="button" aria-pressed="false">Mover pelota</button>
        <label>X pelota <input id="ballX" type="range" min="70" max="930" value="850"></label>
        <label>Y pelota <input id="ballY" type="range" min="80" max="540" value="160"></label>
        <button id="resetBall" type="button">Reset pelota</button>
      </div>

      <div class="legend">
        <div class="key"><span class="dot forward"></span><span>Forward</span></div>
        <div class="key"><span class="dot"></span><span>Back</span></div>
        <div class="key"><span class="dot enemy"></span><span>Defensa</span></div>
        <div class="key"><span class="ball-icon"></span><span>Pelota</span></div>
        <div class="key"><span class="line-icon"></span><span>Ruta solo preview</span></div>
      </div>
    </aside>

    <main>
      <section class="top">
        <div>
          <h2 id="title"></h2>
          <p class="hint" id="desc"></p>
        </div>
        <div class="state" id="state">Preview</div>
      </section>

      <section class="board-wrap">
        <div class="board-shell">
          <svg id="board" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </section>

      <section class="bottom">
        <button id="play" type="button">Play</button>
        <button id="restart" type="button">Reiniciar</button>
        <input id="scrub" type="range" min="0" max="1000" value="0">
        <label>Velocidad <input id="speed" type="range" min="0.6" max="1.6" step="0.1" value="1"></label>
        <span class="time" id="clock">0.0s</span>
      </section>
    </main>
  </div>

  <script>
    const plays = {
      casita: {
        name: 'Casita',
        desc: 'Line derecha. Primer contacto. Vuelta izquierda. Cierre largo al 14.',
        duration: 15,
        start: [850, 160],
        ball: [
          [850,160], [800,250], [710,292], [630,292], [565,292], [520,292],
          [468,332], [392,355], [315,375], [240,400], [190,415],
          [300,468], [405,462], [520,452], [635,438], [750,415], [865,386], [930,370]
        ],
        players: {
          1:[790,190], 2:[850,160], 3:[820,210], 4:[755,222], 6:[715,258],
          7:[610,275], 8:[560,292], 9:[690,338], 10:[615,326],
          11:[320,422], 12:[392,386], 13:[235,402], 14:[865,386], 15:[305,378]
        },
        moving: {
          9:[[682,330],[520,325],[190,438],[405,480]],
          10:[[615,326],[465,335],[300,468],[520,452]],
          14:[[865,386],[930,370]]
        },
        enemies: [[535,250],[450,290],[360,335],[275,385],[635,350],[735,365],[830,385]],
        rucks: [[520,292],[190,415],[405,462]],
        fake: []
      },
      j25: {
        name: 'Jugada 25',
        desc: 'Scrum. 12 al contacto. 15 entre 13 y 14. Escalera final al 11.',
        duration: 14,
        start: [555,330],
        ball: [
          [555,330], [505,350], [410,350], [325,340], [275,340],
          [360,300], [455,305], [548,315], [642,330], [745,350],
          [680,448], [585,470], [492,482], [400,477], [305,462], [205,438], [100,415], [60,410]
        ],
        players: {
          1:[305,462], 2:[400,477], 3:[492,482], 4:[565,420], 5:[205,438],
          7:[292,300], 8:[555,330], 9:[505,350], 10:[585,470],
          11:[100,415], 12:[325,340], 13:[548,300], 14:[750,352], 15:[642,330]
        },
        moving: {
          9:[[505,350],[275,380],[745,390],[680,448]],
          12:[[325,340],[275,340]],
          14:[[745,350],[775,345]],
          11:[[100,415],[60,410]]
        },
        enemies: [[300,292],[245,340],[330,390],[470,270],[560,292],[660,325],[750,382],[390,430],[185,410]],
        rucks: [[275,340],[745,350],[680,448]],
        fake: []
      },
      j27: {
        name: 'Jugada 27',
        desc: 'Scrum a izquierda. Finta corta. Cambio al lado de entrada. 11 final.',
        duration: 13,
        start: [550,335],
        ball: [
          [550,335], [505,350], [410,330], [315,320], [275,320],
          [332,414], [430,458], [525,458], [620,450], [715,438], [805,426], [890,405], [950,392]
        ],
        players: {
          1:[430,458], 2:[525,458], 3:[805,426], 4:[620,450], 5:[715,438],
          7:[215,292], 8:[335,370], 9:[505,350], 10:[425,345],
          11:[890,405], 12:[315,320], 13:[250,330], 14:[190,372], 15:[270,455]
        },
        moving: {
          9:[[505,350],[275,390],[360,430]],
          12:[[315,320],[275,320]],
          13:[[250,330],[185,300]],
          11:[[890,405],[950,392]]
        },
        enemies: [[300,270],[260,320],[225,365],[460,315],[555,335],[650,355],[750,385],[850,410],[930,425]],
        rucks: [[275,320],[805,426]],
        fake: [[275,390],[230,335],[180,300]]
      }
    };

    const forwards = new Set(['1','2','3','4','5','6','7','8']);
    const board = document.getElementById('board');
    const playList = document.getElementById('plays');
    const title = document.getElementById('title');
    const desc = document.getElementById('desc');
    const state = document.getElementById('state');
    const previewBtn = document.getElementById('preview');
    const animationBtn = document.getElementById('animation');
    const playBtn = document.getElementById('play');
    const restartBtn = document.getElementById('restart');
    const scrub = document.getElementById('scrub');
    const speed = document.getElementById('speed');
    const clock = document.getElementById('clock');
    const editBallBtn = document.getElementById('editBall');
    const resetBallBtn = document.getElementById('resetBall');
    const ballX = document.getElementById('ballX');
    const ballY = document.getElementById('ballY');

    let current = 'casita';
    let mode = 'preview';
    let playing = false;
    let time = 0;
    let previous = 0;
    let editing = false;
    let dragging = false;
    const customStarts = {};

    Object.entries(plays).forEach(([id, play]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'play-btn';
      button.textContent = play.name;
      button.addEventListener('click', () => {
        current = id;
        time = 0;
        playing = false;
        render();
      });
      playList.appendChild(button);
    });

    function activePlay() {
      return plays[current];
    }

    function startPoint(play) {
      return customStarts[current] || play.start;
    }

    function route(play) {
      return [startPoint(play), ...play.ball.slice(1)];
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function lerp(a, b, k) {
      return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
    }

    function ease(k) {
      return k * k * (3 - 2 * k);
    }

    function pointOn(points, progress) {
      if (progress <= 0) return points[0];
      if (progress >= 1) return points[points.length - 1];
      const scaled = progress * (points.length - 1);
      const index = Math.floor(scaled);
      return lerp(points[index], points[index + 1], scaled - index);
    }

    function playerPoint(number, base, progress) {
      const path = activePlay().moving[number];
      if (!path) return base;
      return pointOn(path, ease(progress));
    }

    function pathData(points, curved = true) {
      if (!curved || points.length < 3) return `M ${points.map(p => p.join(' ')).join(' L ')}`;
      let d = `M ${points[0][0]} ${points[0][1]}`;
      for (let i = 1; i < points.length - 1; i++) {
        const mid = [(points[i][0] + points[i + 1][0]) / 2, (points[i][1] + points[i + 1][1]) / 2];
        d += ` Q ${points[i][0]} ${points[i][1]} ${mid[0]} ${mid[1]}`;
      }
      const last = points[points.length - 1];
      d += ` T ${last[0]} ${last[1]}`;
      return d;
    }

    function arrowFor(a, b) {
      const angle = Math.atan2(b[1] - a[1], b[0] - a[0]);
      const size = 12;
      const p1 = [b[0] - size * Math.cos(angle - .45), b[1] - size * Math.sin(angle - .45)];
      const p2 = [b[0] - size * Math.cos(angle + .45), b[1] - size * Math.sin(angle + .45)];
      return `${b[0]},${b[1]} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}`;
    }

    function player(number, point) {
      const type = forwards.has(number) ? 'forward' : 'back';
      return `<g class="player ${type}" transform="translate(${point[0]} ${point[1]})">
        <circle r="18"></circle>
        <text>${number}</text>
      </g>`;
    }

    function ball(point) {
      return `<g transform="translate(${point[0]} ${point[1]}) rotate(-18)">
        <ellipse class="ball" rx="15" ry="9"></ellipse>
      </g>`;
    }

    function ruck(point, preview) {
      const cls = preview ? 'ruck preview' : 'ruck';
      return `<path class="${cls}" d="M ${point[0] - 24} ${point[1]}
        L ${point[0] - 12} ${point[1] - 18}
        L ${point[0] + 5} ${point[1] - 24}
        L ${point[0] + 20} ${point[1] - 12}
        L ${point[0] + 26} ${point[1] + 6}
        L ${point[0] + 8} ${point[1] + 22}
        L ${point[0] - 13} ${point[1] + 18} Z"></path>`;
    }

    function field(preview) {
      if (preview) {
        return `<rect class="paper-bg" width="1000" height="620"></rect>
          <rect x="40" y="40" width="920" height="540" fill="none" stroke="rgba(0,0,0,.1)" stroke-width="2"></rect>
          <text class="small-label" x="62" y="72">Preview tactico</text>`;
      }
      return `<rect class="field-bg" width="1000" height="620"></rect>
        <rect class="stripe" x="105" y="35" width="145" height="550"></rect>
        <rect class="stripe" x="500" y="35" width="250" height="550"></rect>
        <g class="field-line">
          <rect x="35" y="35" width="930" height="550"></rect>
          <line x1="105" y1="35" x2="105" y2="585"></line>
          <line x1="895" y1="35" x2="895" y2="585"></line>
          <line x1="500" y1="35" x2="500" y2="585"></line>
          <line class="dash" x1="250" y1="35" x2="250" y2="585"></line>
          <line class="dash" x1="750" y1="35" x2="750" y2="585"></line>
        </g>
        <text class="field-label" x="72" y="315">TRY</text>
        <text class="field-label" x="905" y="315">TRY</text>`;
    }

    function render() {
      const play = activePlay();
      const progress = play.duration ? time / play.duration : 0;
      const preview = mode === 'preview';
      const actualRoute = route(play);
      let html = field(preview);

      if (preview) {
        html += `<path class="route" d="${pathData(actualRoute)}"></path>`;
        for (let i = 1; i < actualRoute.length; i += 3) {
          html += `<polygon class="arrow" points="${arrowFor(actualRoute[i - 1], actualRoute[i])}"></polygon>`;
        }
        if (play.fake.length) html += `<path class="route secondary" d="${pathData(play.fake, false)}"></path>`;
      }

      for (const enemy of play.enemies) html += `<circle class="enemy" cx="${enemy[0]}" cy="${enemy[1]}" r="10"></circle>`;
      for (const item of play.rucks) {
        if (preview || distance(pointOn(actualRoute, progress), item) < 80) html += ruck(item, preview);
      }

      Object.entries(play.players).forEach(([number, base]) => {
        const point = preview ? base : playerPoint(number, base, progress);
        html += player(number, point);
      });

      html += ball(preview ? startPoint(play) : pointOn(actualRoute, ease(progress)));
      board.innerHTML = html;

      title.textContent = play.name;
      desc.textContent = play.desc;
      state.textContent = preview ? 'Preview' : playing ? 'Animando' : 'Animacion pausada';
      previewBtn.setAttribute('aria-pressed', String(preview));
      animationBtn.setAttribute('aria-pressed', String(!preview));
      editBallBtn.setAttribute('aria-pressed', String(editing));
      playBtn.textContent = playing ? 'Pausa' : 'Play';
      scrub.value = Math.round(progress * 1000);
      clock.textContent = `${time.toFixed(1)}s`;
      ballX.value = Math.round(startPoint(play)[0]);
      ballY.value = Math.round(startPoint(play)[1]);
      [...playList.children].forEach((button, index) => button.classList.toggle('active', Object.keys(plays)[index] === current));
    }

    function distance(a, b) {
      return Math.hypot(a[0] - b[0], a[1] - b[1]);
    }

    function tick(now) {
      if (!previous) previous = now;
      const dt = (now - previous) / 1000;
      previous = now;
      if (playing && mode === 'animation') {
        time += dt * Number(speed.value);
        if (time >= activePlay().duration) {
          time = activePlay().duration;
          playing = false;
        }
        render();
      }
      requestAnimationFrame(tick);
    }

    function setMode(next) {
      mode = next;
      if (mode === 'preview') playing = false;
      render();
    }

    function svgPoint(event) {
      const pt = board.createSVGPoint();
      pt.x = event.clientX;
      pt.y = event.clientY;
      return pt.matrixTransform(board.getScreenCTM().inverse());
    }

    previewBtn.addEventListener('click', () => setMode('preview'));
    animationBtn.addEventListener('click', () => setMode('animation'));
    playBtn.addEventListener('click', () => {
      mode = 'animation';
      if (time >= activePlay().duration) time = 0;
      playing = !playing;
      render();
    });
    restartBtn.addEventListener('click', () => {
      time = 0;
      playing = false;
      render();
    });
    scrub.addEventListener('input', () => {
      mode = 'animation';
      playing = false;
      time = Number(scrub.value) / 1000 * activePlay().duration;
      render();
    });
    editBallBtn.addEventListener('click', () => {
      editing = !editing;
      mode = 'preview';
      playing = false;
      render();
    });
    resetBallBtn.addEventListener('click', () => {
      delete customStarts[current];
      render();
    });
    ballX.addEventListener('input', () => {
      customStarts[current] = [Number(ballX.value), Number(ballY.value)];
      render();
    });
    ballY.addEventListener('input', () => {
      customStarts[current] = [Number(ballX.value), Number(ballY.value)];
      render();
    });
    board.addEventListener('pointerdown', event => {
      if (!editing || mode !== 'preview') return;
      const p = svgPoint(event);
      if (distance([p.x, p.y], startPoint(activePlay())) < 36) dragging = true;
    });
    board.addEventListener('pointermove', event => {
      if (!dragging) return;
      const p = svgPoint(event);
      customStarts[current] = [clamp(p.x, 70, 930), clamp(p.y, 80, 540)];
      render();
    });
    window.addEventListener('pointerup', () => dragging = false);

    render();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
